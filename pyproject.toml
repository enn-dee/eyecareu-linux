[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eyecareu"
version = "1.0.2"
description = "Linux port of BenQ Eye-CareU: DDC/CI monitor control and software eye-care"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eye-CareU Linux port" }]
keywords = ["monitor", "ddc-ci", "eye-care", "benq", "wayland", "x11", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
eyecareu = "eyecareu.app:main"

[project.gui-scripts]
eyecareu-tray = "eyecareu.app:main"

[tool.setuptools]
packages = ["eyecareu", "eyecareu.ddc", "eyecareu.display", "eyecareu.features"]

[tool.setuptools.package-data]
eyecareu = [
    "qml/*.qml",
    "qml/*/qmldir",
    "qml/*/*.qml",
]
